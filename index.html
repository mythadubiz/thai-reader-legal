<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thai Reader - Legal &amp; Support</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif;
            background: #f7f9fb;
            color: #1a2b3c;
            line-height: 1.7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            text-align: center;
            background: white;
            border-radius: 24px;
            padding: 48px 40px;
            max-width: 400px;
            margin: 20px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        .card img {
            width: 96px;
            height: 96px;
            border-radius: 22px;
            margin-bottom: 20px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        .card h1 { font-size: 1.5em; font-weight: 800; margin-bottom: 4px; }
        .card .brand-thai { color: #469DF0; }
        .card .brand-reader { color: #EAA33F; }
        .card p { color: #5a6d80; font-size: 0.95em; margin-bottom: 28px; }
        .links a {
            display: block;
            padding: 14px 24px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #3E90E5 0%, #1D488A 100%);
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1em;
            transition: transform 0.2s;
        }
        .links a:hover { transform: scale(1.03); }
        .links a.support { background: linear-gradient(135deg, #F09A3F 0%, #C87A2A 100%); }
        .links a:last-child { margin-bottom: 0; }
        .foot { margin-top: 28px; color: #5a6d80; font-size: 0.78em; }
        .foot a { color: #2B72C0; }
    </style>
</head>
<body>
    <div class="card">
        <img src="images/appicon.png" alt="Thai Reader">
        <h1><span class="brand-thai">Thai</span> <span class="brand-reader">Reader</span></h1>
        <p>Learn to read Thai — the alphabet, tones &amp; words.<br>Pay once. No subscription, ever.</p>
        <div class="links">
            <a href="privacy.html">Privacy Policy</a>
            <a href="terms.html">Terms of Use</a>
            <a class="support" href="https://mythadubiz.github.io/contact/?app=thai-reader&amp;lang=en&amp;ctx=support">Contact &amp; Support</a>
        </div>
        <p class="foot">&copy; 2026 TMD &middot; <a href="https://mythadubiz.github.io/contact/?app=thai-reader&amp;lang=en&amp;ctx=support">Contact form</a></p>
    </div>
</body>
</html>
